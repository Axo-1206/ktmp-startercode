# .github/workflows/ci.yml
# Chạy toàn bộ bộ test Selenium / JUnit 5 trên GitHub Actions.
#
# Trigger:
#   - push lên bất kỳ branch nào
#   - pull_request nhắm vào main/master
#   - workflow_dispatch (chạy thủ công từ UI)
#
# Artifact được lưu:
#   - surefire-reports   : kết quả XML/HTML của Maven Surefire
#   - screenshots        : ảnh chụp khi test FAIL (target/screenshots/**)

name: Selenium Tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  test:
    name: Run JUnit 5 Selenium Tests
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout source ────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Set up JDK 17 ─────────────────────────────────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven

      # ── 3. Set up Chrome (Selenium Manager tự tải chromedriver) ──────────
      - name: Set up Google Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      # ── 4. Run Maven tests (headless Chrome) ─────────────────────────────
      # Surefire sẽ viết kết quả vào target/surefire-reports/
      # ScreenshotWatcher sẽ viết ảnh vào target/screenshots/
      # "|| true" ở cuối đảm bảo các bước upload artifact vẫn chạy ngay cả
      # khi có test FAIL (để ta thu được report và ảnh).
      - name: Run tests
        run: |
          mvn -B test \
            -Dheadless=true \
            -Dbrowser=chrome \
            -DbaseUrl=https://www.saucedemo.com \
            -Dsurefire.failIfNoSpecifiedTests=false \
        continue-on-error: true

      # ── 5. Upload Surefire reports ────────────────────────────────────────
      - name: Upload Surefire Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          retention-days: 30
          if-no-files-found: warn

      # ── 6. Upload failure screenshots ────────────────────────────────────
      - name: Upload Failure Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: target/screenshots/
          retention-days: 30
          if-no-files-found: ignore

      # ── 7. Fail the job nếu bước "Run tests" thực sự fail ────────────────
      # (vì ở bước 4 ta dùng continue-on-error: true để upload artifact trước)
      - name: Check test result
        if: always()
        run: |
          if [ -d "target/surefire-reports" ]; then
            FAILURES=$(grep -rl 'failures="[1-9]\|errors="[1-9]' target/surefire-reports/ | wc -l)
            if [ "$FAILURES" -gt "0" ]; then
              echo "::error::$FAILURES test suite(s) reported failures or errors."
              exit 1
            fi
          fi
          echo "All test suites passed."
